<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindNotes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>emailjs.init("jUbB80V-6lf8bp6_r");</script>
<style>:root{--bg:#f7f1e8;--card:#fff;--text:#1a1a1a;--bdr:#e8ddd0;--mut:#8a7d6f;--btn:#111;--btnT:#fff}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0f0f0f;--card:#1c1c1c;--text:#f0f0f0;--bdr:#2a2a2a;--mut:#9a9a9a;--btn:#fff;--btnT:#111}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.logo{font-family:Fraunces;font-weight:700;font-size:24px}.btn{border:1px solid var(--bdr);background:var(--card);padding:8px 14px;border-radius:99px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;font-weight:600}.btn.dark{background:var(--btn);color:var(--btnT)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;overflow:hidden;position:relative;cursor:pointer}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.cardBody{padding:12px}.box{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px;max-height:94vh;overflow:auto}.inp{width:100%;border:1px solid var(--bdr);background:var(--bg);padding:12px;border-radius:12px;margin-top:10px;color:var(--text)}#postView{display:none;max-width:700px;margin:auto;padding:12px}.car{position:relative;background:#000;border-radius:20px;overflow:hidden;height:520px;display:flex;align-items:center;justify-content:center}.carTrack{display:flex;width:100%;height:100%;transition:transform.35s}.carTrack img{width:100%;height:100%;object-fit:contain;flex-shrink:0}.cAr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);color:#000;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.cAr.l{left:10px}.cAr.r{right:10px}.drawer{position:fixed;top:0;right:-100%;width:88%;max-width:340px;height:100%;background:var(--card);z-index:60;transition:.35s;border-left:1px solid var(--bdr);padding:20px;overflow:auto}.drawer.open{right:0}.bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:55}.bg.open{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}</style>
</head><body>
<div class="top"><div class="logo">MindNotes.</div><div class="btn" onclick="openDrawer()">Menu</div></div>
<div class="grid" id="grid"></div>
<div id="postView"><div style="display:flex;gap:8px"><div class="btn" onclick="closePost()">Back</div><b id="pTop" style="flex:1"></b><div class="btn" onclick="archivePost()">Archive</div><div class="btn" style="color:#ff3b30" onclick="deletePost()">Delete</div></div><div class="car" id="car" style="margin-top:12px"><div class="carTrack" id="track"></div><div class="cAr l" onclick="slide(-1)"><</div><div class="cAr r" onclick="slide(1)">></div></div><h2 id="pTitle" style="margin-top:12px"></h2><p id="pBody" style="color:gray"></p></div>
<div class="drawer" id="drawer"><div style="display:flex;justify-content:space-between"><b>Access</b><div class="btn" onclick="closeDrawer()">X</div></div>
<div id="authSection" style="margin-top:20px;padding:12px;background:var(--bg);border:1px solid var(--bdr);border-radius:14px">
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <div id="tabPublic" class="btn dark" style="flex:1;justify-content:center" onclick="switchTab('public')">Public</div>
    <div id="tabAdmin" class="btn" style="flex:1;justify-content:center" onclick="switchTab('admin')">Admin</div>
  </div>
  <div id="publicLoginBox">
    <input id="publicEmail" class="inp" placeholder="Enter Gmail">
    <div class="btn dark" style="width:100%;margin-top:10px;justify-content:center" onclick="sendPublicOtp()">Send OTP</div>
  </div>
  <div id="adminLoginBox" style="display:none">
    <input id="adminUser" class="inp" placeholder="Username" autocomplete="off">
    <input id="adminPass" type="password" class="inp" placeholder="Password" autocomplete="off">
    <input id="adminEmail" class="inp" placeholder="Admin Gmail (optional)">
    <div class="btn dark" style="width:100%;margin-top:10px;justify-content:center" onclick="sendAdminOtp()">Login</div>
  </div>
  <div id="otpBox" style="display:none;margin-top:12px;border-top:1px dashed var(--bdr);padding-top:10px">
    <input id="otpInput" class="inp" placeholder="Enter 6 digit OTP">
    <div style="display:flex;gap:8px;margin-top:8px">
      <div class="btn dark" style="flex:1;justify-content:center" onclick="verifyOtp()">Verify</div>
      <div class="btn" style="flex:1;justify-content:center" onclick="resendOtp()">Resend</div>
    </div>
  </div>
  <div id="authMsg" style="font-size:11px;margin-top:8px;color:gray"></div>
</div>
<div id="adminSection" style="display:none;margin-top:20px"><div class="btn" style="width:100%;margin-top:12px" onclick="signOut()">Sign Out</div></div>
<div id="newPostBtn" class="btn dark" style="width:100%;margin-top:22px;padding:14px;justify-content:center;display:none" onclick="openCreate()">+ New Post</div></div>
<div class="bg" id="bg" onclick="closeDrawer()"></div>
<div class="modal" id="createModal"><div class="box"><h3>New Post</h3><input id="tCat" class="inp" placeholder="Category"><input id="tTitle" class="inp" placeholder="Title *"><input type="file" id="fImg" accept="image/*" multiple style="display:none" onchange="onImg(this)"><div class="btn" style="width:100%;margin-top:10px;justify-content:center;padding:12px" onclick="document.getElementById('fImg').click()">Add Photos</div><div id="prev" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><textarea id="tBody" class="inp" style="height:100px" placeholder="Caption..."></textarea><div style="display:flex;gap:8px;margin-top:14px"><div class="btn" style="flex:1;justify-content:center" onclick="closeCreate()">Cancel</div><div class="btn dark" style="flex:1;justify-content:center" onclick="savePost()">Post</div></div></div></div>
<script>
const EMAILJS_SERVICE="service_94nz42k";const EMAILJS_TEMPLATE="template_gld3yem";const ADMIN_USER="@aarsrosin";const ADMIN_PASS="@storytelker";let currentRole='public';
function switchTab(t){currentRole=t;document.getElementById('publicLoginBox').style.display=t==='public'?'block':'none';document.getElementById('adminLoginBox').style.display=t==='admin'?'block':'none';document.getElementById('tabPublic').className=t==='public'?'btn dark':'btn';document.getElementById('tabAdmin').className=t==='admin'?'btn dark':'btn';document.getElementById('otpBox').style.display='none';document.getElementById('authMsg').innerText='';}
function checkAuth(){let l=localStorage.getItem('mn_logged')==='1';document.getElementById('authSection').style.display=l?'none':'block';document.getElementById('adminSection').style.display=l?'block':'none';document.getElementById('newPostBtn').style.display=l?'flex':'none';return l;}
function sendOtpToEmail(email,otp){return emailjs.send(EMAILJS_SERVICE,EMAILJS_TEMPLATE,{email:email,to_email:email,otp:otp});}
function sendPublicOtp(){let email=document.getElementById('publicEmail').value.trim();if(!email.includes('@')){document.getElementById('authMsg').innerText='Valid Gmail';return;}let otp=Math.floor(100000+Math.random()*900000);localStorage.setItem('mn_otp',String(otp));localStorage.setItem('mn_role','public');localStorage.setItem('mn_email',email);document.getElementById('authMsg').innerText='Sending OTP...';sendOtpToEmail(email,otp).then(()=>{document.getElementById('otpBox').style.display='block';document.getElementById('authMsg').style.color='green';document.getElementById('authMsg').innerText='OTP sent';}).catch(()=>{document.getElementById('authMsg').style.color='red';document.getElementById('authMsg').innerText='Failed to send';});}
function sendAdminOtp(){let u=document.getElementById('adminUser').value.trim();let p=document.getElementById('adminPass').value.trim();let email=document.getElementById('adminEmail').value.trim();if(u!==ADMIN_USER||p!==ADMIN_PASS){document.getElementById('authMsg').style.color='red';document.getElementById('authMsg').innerText='Wrong credentials';return;}if(email===''){localStorage.setItem('mn_logged','1');localStorage.setItem('mn_user_role','admin');checkAuth();alert('Admin Login Success');return;}let otp=Math.floor(100000+Math.random()*900000);localStorage.setItem('mn_otp',String(otp));localStorage.setItem('mn_role','admin');localStorage.setItem('mn_email',email);sendOtpToEmail(email,otp).then(()=>{document.getElementById('otpBox').style.display='block';document.getElementById('authMsg').innerText='Admin OTP sent';}).catch(()=>{document.getElementById('authMsg').innerText='Failed';});}
function verifyOtp(){let e=document.getElementById('otpInput').value.trim();let r=localStorage.getItem('mn_otp');if(e===r&&e!==''){localStorage.setItem('mn_logged','1');checkAuth();alert('Verified');}else{document.getElementById('authMsg').innerText='Wrong OTP';}}
function resendOtp(){let role=localStorage.getItem('mn_role');if(role==='public')sendPublicOtp();else sendAdminOtp();}
function signOut(){localStorage.clear();location.reload();}
const DB_NAME='MindNotesDB';function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains('posts'))db.createObjectStore('posts',{keyPath:'id'});};r.onsuccess=()=>res(r.result);});}
async function dbGetAll(s){let db=await openDB();return new Promise(res=>{let tx=db.transaction(s,'readonly');let req=tx.objectStore(s).getAll();req.onsuccess=()=>res(req.result);});}
async function dbPut(s,o){let db=await openDB();return new Promise(res=>{let tx=db.transaction(s,'readwrite');tx.objectStore(s).put(o);tx.oncomplete=()=>res();});}
async function dbDel(s,id){let db=await openDB();return new Promise(res=>{let tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>res();});}
let POSTS=[],cur=0,ci=0,tmp=[];async function init(){POSTS=await dbGetAll('posts');if(!POSTS.length){let def={id:Date.now(),cat:"NOTES",title:"Welcome",body:"MindNotes",slides:[{src:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800"}],date:Date.now(),archived:false};await dbPut('posts',def);POSTS=[def];}render();checkAuth();}
function render(){document.getElementById('grid').innerHTML=POSTS.filter(p=>!p.archived).map((p,i)=>'<div class="card" onclick="openPost('+POSTS.indexOf(p)+')"><img src="'+p.slides[0].src+'"><div style="padding:12px"><b>'+p.title+'</b></div></div>').join('');}
function openPost(i){cur=i;let p=POSTS[i];document.getElementById('grid').style.display='none';document.getElementById('postView').style.display='block';document.getElementById('pTitle').innerText=p.title;document.getElementById('pBody').innerText=p.body;let t=document.getElementById('track');t.innerHTML=p.slides.map(s=>'<img src="'+s.src+'">').join('');}
function closePost(){document.getElementById('grid').style.display='grid';document.getElementById('postView').style.display='none';render();}
function slide(d){ci=(ci+d+POSTS[cur].slides.length)%POSTS[cur].slides.length;document.getElementById('track').style.transform='translateX(-'+ci*100+'%)';}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('bg').classList.add('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('bg').classList.remove('open');}
function openCreate(){if(!checkAuth()){alert('Login first');return;}tmp=[];document.getElementById('prev').innerHTML='';document.getElementById('createModal').classList.add('open');}
function closeCreate(){document.getElementById('createModal').classList.remove('open');}
function onImg(inp){let fs=[...inp.files].slice(0,4);fs.forEach(f=>{let r=new FileReader();r.onload=e=>{tmp.push({src:e.target.result});renderPrev();};r.readAsDataURL(f);});}
function renderPrev(){document.getElementById('prev').innerHTML=tmp.map((s,i)=>'<div style="position:relative;width:76px;height:76px"><img src="'+s.src+'" style="width:100%;height:100%;object-fit:cover"><div onclick="tmp.splice('+i+',1);renderPrev()" style="position:absolute;top:0;right:0;background:red;color:#fff;padding:2px 5px;border-radius:50%">x</div></div>').join('');}
async function savePost(){let title=document.getElementById('tTitle').value.trim();if(!title)return;let cat=document.getElementById('tCat').value.trim()||'NOTES';let body=document.getElementById('tBody').value.trim();let p={id:Date.now(),cat,title,body,slides:tmp,date:Date.now(),archived:false};await dbPut('posts',p);POSTS.unshift(p);closeCreate();render();}
function archivePost(){let p=POSTS[cur];p.archived=true;dbPut('posts',p);closePost();}
function deletePost(){if(!confirm('Delete?'))return;let p=POSTS[cur];dbDel('posts',p.id);POSTS.splice(cur,1);closePost();}
init();
</script>
</body></html>
