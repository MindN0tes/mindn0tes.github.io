<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindNotes.</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#f7f1e8;--card:#fff;--text:#1a1a1a;--bdr:#e8ddd0;--mut:#8a7d6f;--btn:#111;--btnT:#fff}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Manrope,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#111;--card:#1c1c1c;--text:#eee;--bdr:#333;--mut:#aaa;--btn:#fff;--btnT:#111}.top{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;padding:10px 12px}.logo{font-family:Fraunces;font-weight:700;font-size:22px}.btn{border:1px solid var(--bdr);background:var(--card);padding:7px 12px;border-radius:99px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.btn.dark{background:var(--btn);color:var(--btnT)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;position:relative}.card img,.card video{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.cardBody{padding:8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.open{display:flex}.box{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:14px;max-height:92vh;overflow:auto}.inp{width:100%;border:1px solid var(--bdr);background:var(--bg);padding:10px;border-radius:10px;margin-top:8px;color:var(--text)}#postView{display:none;max-width:700px;margin:auto;padding:10px}.car{position:relative;background:#000;border-radius:16px;overflow:hidden;height:460px;display:flex;align-items:center;justify-content:center}.carTrack{display:flex;width:100%;height:100%;transition:transform.3s}.carTrack img,.carTrack video{width:100%;height:100%;object-fit:contain;flex-shrink:0}.cAr{position:absolute;top:50%;transform:translateY(-50%);background:#fff;color:#000;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}.cAr.l{left:8px}.cAr.r{right:8px}.cDotRow{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center}.cDot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}.cDot.on{background:#fff}.dateTag{font-size:11px;border:1px solid var(--bdr);padding:4px 8px;border-radius:99px;background:var(--bg)}.prevWrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.prevItem{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden}.prevItem img,.prevItem video{width:100%;height:100%;object-fit:cover}.prevItem span{position:absolute;top:2px;right:2px;background:red;color:#fff;font-size:9px;padding:2px 4px;border-radius:50%;cursor:pointer}.drawer{position:fixed;top:0;right:-100%;width:84%;max-width:320px;height:100%;background:var(--card);z-index:40;transition:.3s;border-left:1px solid var(--bdr);padding:14px;overflow:auto}.drawer.open{right:0}.bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:35}.bg.open{display:block}#cropBox{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move}.musicBar{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--bdr);padding:8px;border-radius:12px;margin-top:8px}
</style></head><body>
<div class="top"><div class="logo">MindNotes.</div><div style="display:flex;gap:6px"><div class="btn" onclick="toggleLang()">🌐 <span id="curLang">EN</span></div><div class="btn" onclick="openDrawer()">☰ Menu</div></div></div>
<div class="grid" id="grid"></div>
<div id="postView"><div style="display:flex;gap:6px;align-items:center"><div class="btn" onclick="closePost()">← Back</div><b id="pTop" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Post</b><div class="btn" onclick="share()">↗ Share</div><div class="btn" onclick="if(confirm('Archive?')){POSTS[cur].archived=!POSTS[cur].archived;save();closePost();render();}">📦</div><div class="btn" onclick="if(confirm('Delete?')){POSTS.splice(cur,1);save();closePost();render();}">🗑️</div></div>
<div id="dateTag" style="margin-top:8px"></div>
<div class="car" id="car" style="margin-top:8px"><div class="carTrack" id="track"></div><div class="cAr l" onclick="slide(-1)">‹</div><div class="cAr r" onclick="slide(1)">›</div><div class="cDotRow" id="dots"></div></div>
<div id="authBox" style="display:flex;gap:8px;align-items:center;margin-top:10px"></div><h2 id="pTitle" style="font-family:Fraunces;margin-top:10px"></h2><p id="pBody" style="color:var(--mut);margin-top:6px;white-space:pre-wrap"></p>
<div id="musicBar" class="musicBar" style="display:none"></div>
<div style="display:flex;gap:8px;margin-top:10px"><div class="btn" onclick="like()">❤️ <span id="likeC">0</span></div><div class="btn" onclick="document.getElementById('cIn').focus()">💬 <span id="cC">0</span></div></div>
<div style="background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:10px;margin-top:10px"><b>Comments</b><div id="cList" style="margin-top:6px"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="cIn" class="inp" style="margin:0" placeholder="Add comment..."><div class="btn dark" onclick="addC()">Post</div></div></div></div>
<div class="drawer" id="drawer"><div style="display:flex;justify-content:space-between"><b>Menu</b><div class="btn" onclick="closeDrawer()">✕</div></div>
<div style="margin-top:12px"><input id="adminName" class="inp" placeholder="Your Name"><div style="display:flex;gap:6px;margin-top:6px"><input type="file" id="adminPicIn" accept="image/*" style="display:none" onchange="setAdminPic(this)"><div class="btn" onclick="document.getElementById('adminPicIn').click()">📸 Photo</div><div class="btn dark" onclick="saveName()">Save</div></div><div id="adminPicPrev" style="margin-top:6px"></div></div>
<div style="margin-top:12px;display:flex;justify-content:space-between"><span>Dark Mode</span><div class="btn" onclick="toggleTheme()">Toggle</div></div>
<div class="btn" style="width:100%;margin-top:8px" onclick="openCreate();closeDrawer()">+ New Post</div>
<div class="btn" style="width:100%;margin-top:6px" onclick="openDrafts()">Drafts <span id="dCount"></span></div>
<div class="btn" style="width:100%;margin-top:6px" onclick="openArchive()">Archived <span id="aCount"></span></div>
<div class="btn" style="width:100%;margin-top:6px;background:#ffdddd" onclick="if(confirm('Clear all storage?')){localStorage.clear();location.reload();}">🧹 Clear Full Storage</div>
<div id="authArea" style="margin-top:10px"><div class="btn" style="width:100%" onclick="localStorage.setItem('mn_admin','1');alert('Admin enabled')">Enable Admin</div></div>
</div><div class="bg" id="bg" onclick="closeDrawer()"></div>
<div class="modal" id="createModal"><div class="box"><h3>New Post</h3><input id="tCat" class="inp" placeholder="Category"><input id="tTitle" class="inp" placeholder="Title * Required"><input id="tDate" type="datetime-local" class="inp"><input type="file" id="fImg" accept="image/*,video/*" multiple style="display:none" onchange="onImg(this)"><div class="btn" style="width:100%;margin-top:8px" onclick="document.getElementById('fImg').click()">📸 Add Photos/Videos (max 4)</div><div id="prev" class="prevWrap"></div><input id="spotify" class="inp" placeholder="Spotify link https://open.spotify.com/track/..." oninput="onSpotify()"><div id="spotPrev" style="margin-top:6px"></div><textarea id="tBody" class="inp" style="height:80px" placeholder="Caption..."></textarea><div style="display:flex;gap:6px;margin-top:10px"><div class="btn" style="flex:1" onclick="saveDraft()">Draft</div><div class="btn" style="flex:1" onclick="closeCreate()">Cancel</div><div class="btn dark" style="flex:1" onclick="savePost()">Post</div></div></div></div>
<div class="modal" id="draftModal"><div class="box"><div style="display:flex;justify-content:space-between"><b>Drafts</b><div class="btn" onclick="closeDrafts()">✕</div></div><div id="draftList"></div></div></div>
<div class="modal" id="archiveModal"><div class="box"><div style="display:flex;justify-content:space-between"><b>Archived</b><div class="btn" onclick="closeArchive()">✕</div></div><div id="archiveList"></div></div></div>
<div class="modal" id="cropModal"><div class="box"><div style="display:flex;justify-content:space-between"><b>Crop</b><div class="btn" onclick="closeCrop()">✕</div></div><div id="cropCont" style="position:relative;width:100%;height:300px;background:#000;margin-top:8px;overflow:hidden"><img id="cropImg" style="width:100%;height:100%;object-fit:contain"><div id="cropBox" style="left:20%;top:20%;width:60%;height:60%"></div></div><div style="display:flex;gap:6px;margin-top:8px"><div class="btn" onclick="setRatio('1:1')">1:1</div><div class="btn" onclick="setRatio('4:5')">4:5</div><div class="btn dark" style="flex:1" onclick="applyCrop()">Apply</div></div></div></div>
<script>
let POSTS=JSON.parse(localStorage.getItem('mn_full')||'null')||[{cat:"COFFEE",title:"My 6am coffee ritual",body:"Slow mornings & coffee.",slides:[{type:"image",src:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800"}],music:null,authorPic:null,date:Date.now(),archived:false}];
let DRAFTS=JSON.parse(localStorage.getItem('mn_drafts_full')||'[]');
let cur=0,ci=0,tmp=[],tmpM=null,cropIdx=-1;
function save(){try{localStorage.setItem('mn_full',JSON.stringify(POSTS));localStorage.setItem('mn_drafts_full',JSON.stringify(DRAFTS));return true;}catch(e){alert('Storage full! Use Spotify link instead of file. Clear storage from Menu.');return false;}}
function getAdminPic(){return localStorage.getItem('mn_admin_pic')||''}
function getAdminName(){return localStorage.getItem('mn_admin_name')||'Rohit Kumar'}
function render(){document.getElementById('grid').innerHTML=POSTS.filter(p=>!p.archived).map((p)=>{let orig=POSTS.indexOf(p);return `<div class="card" onclick="openPost(${orig})"><${p.slides[0].type==='video'?'video':'img'} src="${p.slides[0].src}" ${p.slides[0].type==='video'?'muted':''}></${p.slides[0].type==='video'?'video':'img'}><div style="position:absolute;top:6px;left:6px;background:#000;color:#fff;font-size:9px;padding:2px 6px;border-radius:99px">${p.slides.length}</div>${p.music?`<div style="position:absolute;top:6px;right:6px;background:#fff;font-size:9px;padding:2px 6px;border-radius:99px">🎵</div>`:''}<div class="cardBody"><b style="font-size:12px">${p.title}</b><div style="font-size:10px;color:gray">${p.cat}</div></div></div>`}).join('');document.getElementById('dCount').innerText=DRAFTS.length?DRAFTS.length+' ›':'';document.getElementById('aCount').innerText=POSTS.filter(p=>p.archived).length?POSTS.filter(p=>p.archived).length+' ›':'';document.getElementById('adminPicPrev').innerHTML=getAdminPic()?`<img src="${getAdminPic()}" style="width:40px;height:40px;border-radius:50%">`:'';}
function openPost(i){cur=i;ci=0;let p=POSTS[i];document.getElementById('grid').style.display='none';document.getElementById('postView').style.display='block';document.getElementById('pTop').innerText=p.title;document.getElementById('pTitle').innerText=p.title;document.getElementById('pBody').innerText=p.body;document.getElementById('dateTag').innerHTML=`<span class="dateTag">🕒 ${new Date(p.date).toLocaleString()}</span>`;let t=document.getElementById('track');t.innerHTML=p.slides.map(s=>s.type==='video'?`<video src="${s.src}" controls></video>`:`<img src="${s.src}">`).join('');t.style.transform='translateX(0)';document.getElementById('dots').innerHTML=p.slides.map((_,k)=>`<div class="cDot ${k===0?'on':''}"></div>`).join('');document.getElementById('authBox').innerHTML=`<div style="width:32px;height:32px;border-radius:50%;overflow:hidden;background:#111;color:#fff;display:flex;align-items:center;justify-content:center">${p.authorPic||getAdminPic()?`<img src="${p.authorPic||getAdminPic()}" style="width:100%;height:100%;object-fit:cover">`:'R'}</div><b style="font-size:12px">${getAdminName()}</b>`;let mb=document.getElementById('musicBar');if(p.music){if(p.music.type==='spotify'){mb.style.display='block';mb.innerHTML=`<iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/${p.music.spotifyId}" width="100%" height="80" frameborder="0" allow="autoplay"></iframe>`;}else{mb.style.display='flex';mb.innerHTML=`<div class="btn" onclick="let a=document.getElementById('pa');a.paused?a.play():a.pause()">♪ Play</div><div><b>${p.music.name}</b></div><audio id="pa" src="${p.music.src}"></audio>`;}}else mb.style.display='none';renderLike();renderComments();window.scrollTo(0,0);}
function closePost(){document.getElementById('grid').style.display='grid';document.getElementById('postView').style.display='none';}
function slide(d){let p=POSTS[cur];ci=(ci+d+p.slides.length)%p.slides.length;document.getElementById('track').style.transform=`translateX(-${ci*100}%)`;document.querySelectorAll('.cDot').forEach((e,i)=>e.classList.toggle('on',i===ci));}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('bg').classList.add('open');}function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('bg').classList.remove('open');}
function openCreate(){tmp=[];tmpM=null;document.getElementById('prev').innerHTML='';document.getElementById('spotPrev').innerHTML='';document.getElementById('tTitle').value='';document.getElementById('tBody').value='';document.getElementById('tCat').value='';document.getElementById('spotify').value='';let n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());document.getElementById('tDate').value=n.toISOString().slice(0,16);document.getElementById('createModal').classList.add('open');closeDrawer();}
function closeCreate(){document.getElementById('createModal').classList.remove('open');}
function compress(file,cb){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=700;let w=img.width>max?max:img.width;let h=w/(img.width/img.height);c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.6));};img.src=e.target.result;};r.readAsDataURL(file);}
function onImg(inp){let fs=[...inp.files].slice(0,4);fs.forEach(f=>{if(f.type.startsWith('video')){let r=new FileReader();r.onload=e=>{tmp.push({type:'video',src:e.target.result});renderPrev();};r.readAsDataURL(f);}else compress(f,d=>{tmp.push({type:'image',src:d});renderPrev();});});inp.value='';}
function renderPrev(){document.getElementById('prev').innerHTML=tmp.map((s,i)=>`<div class="prevItem">${s.type==='video'?`<video src="${s.src}"></video>`:`<img src="${s.src}">`}<span onclick="tmp.splice(${i},1);renderPrev()">✕</span><div style="position:absolute;bottom:0;left:0;right:0;text-align:center;background:rgba(0,0,0,.6);color:#fff;font-size:9px" onclick="openCrop(${i})">Crop</div></div>`).join('');}
function openCrop(i){cropIdx=i;document.getElementById('cropModal').classList.add('open');document.getElementById('cropImg').src=tmp[i].src;}
function closeCrop(){document.getElementById('cropModal').classList.remove('open');}
function setRatio(r){let b=document.getElementById('cropBox');if(r==='1:1'){b.style.width='60%';b.style.height='60%';}else if(r==='4:5'){b.style.width='50%';b.style.height='62%';}else{b.style.width='70%';b.style.height='39%';}}
function applyCrop(){let img=document.getElementById('cropImg');let box=document.getElementById('cropBox');let ir=img.getBoundingClientRect();let bx=box.getBoundingClientRect();let sx=(bx.left-ir.left)/ir.width*img.naturalWidth, sy=(bx.top-ir.top)/ir.height*img.naturalHeight, sw=bx.width/ir.width*img.naturalWidth, sh=bx.height/ir.height*img.naturalHeight;let c=document.createElement('canvas');c.width=sw;c.height=sh;let im=new Image();im.onload=()=>{c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,sw,sh);tmp[cropIdx].src=c.toDataURL('image/jpeg',0.6);closeCrop();renderPrev();};im.src=tmp[cropIdx].src;}
function onSpotify(){let u=document.getElementById('spotify').value;let id=u.split('track/')[1]?.split('?')[0]?.split('/')[0];if(!id)return;tmpM={type:'spotify',spotifyId:id,name:'Spotify',dur:30};document.getElementById('spotPrev').innerHTML=`<span style="color:green;font-size:11px">✓ Spotify loaded</span>`;}
function saveDraft(){if(!tmp.length){alert('Add photo');return;}let d={cat:document.getElementById('tCat').value||'NOTES',title:document.getElementById('tTitle').value||'Untitled',body:document.getElementById('tBody').value,slides:tmp,music:tmpM,date:document.getElementById('tDate').value?new Date(document.getElementById('tDate').value).getTime():Date.now()};DRAFTS.unshift(d);save();closeCreate();render();alert('Draft saved');}
function openDrafts(){document.getElementById('draftModal').classList.add('open');document.getElementById('draftList').innerHTML=DRAFTS.map((d,i)=>`<div style="display:flex;gap:6px;padding:6px;border-bottom:1px solid #eee"><img src="${d.slides[0].src}" style="width:40px;height:40px;border-radius:6px"><div style="flex:1"><b style="font-size:12px">${d.title}</b></div><div class="btn dark" onclick="POSTS.unshift({...DRAFTS[${i}],archived:false,authorPic:getAdminPic()});DRAFTS.splice(${i},1);save();closeDrafts();render();">Post</div><div class="btn" onclick="DRAFTS.splice(${i},1);save();openDrafts();render()">Del</div></div>`).join('')||'No drafts';}
function closeDrafts(){document.getElementById('draftModal').classList.remove('open');}
function openArchive(){document.getElementById('archiveModal').classList.add('open');let a=POSTS.filter(p=>p.archived);document.getElementById('archiveList').innerHTML=a.map(p=>{let idx=POSTS.indexOf(p);return `<div style="display:flex;gap:6px;padding:6px"><img src="${p.slides[0].src}" style="width:40px;height:40px;border-radius:6px"><div style="flex:1"><b>${p.title}</b></div><div class="btn" onclick="POSTS[${idx}].archived=false;save();openArchive();render()">Restore</div></div>`}).join('')||'No archived';}
function closeArchive(){document.getElementById('archiveModal').classList.remove('open');}
function savePost(){let t=document.getElementById('tTitle').value.trim();if(!t){alert('Please enter Title');return;}if(!tmp.length){alert('Add photo');return;}let p={cat:document.getElementById('tCat').value||'NOTES',title:t,body:document.getElementById('tBody').value,slides:tmp,music:tmpM,authorPic:getAdminPic(),date:document.getElementById('tDate').value?new Date(document.getElementById('tDate').value).getTime():Date.now(),archived:false};POSTS.unshift(p);if(save()){closeCreate();render();alert('Posted ✓');}}
function like(){let k='like_'+cur;let L=JSON.parse(localStorage.getItem('mn_likes')||'{}');L[k]=(L[k]||0)+1;localStorage.setItem('mn_likes',JSON.stringify(L));renderLike();}function renderLike(){let L=JSON.parse(localStorage.getItem('mn_likes')||'{}');document.getElementById('likeC').innerText=L['like_'+cur]||0;}
function getC(){return JSON.parse(localStorage.getItem('mn_comments')||'{}')}function renderComments(){let C=getC();let list=C['c_'+cur]||[];document.getElementById('cC').innerText=list.length;document.getElementById('cList').innerHTML=list.map(x=>`<div style="padding:4px 0;border-bottom:1px solid #eee"><b>${x.name}</b>: ${x.text}</div>`).join('')||'No comments';}function addC(){let t=document.getElementById('cIn').value.trim();if(!t)return;let C=getC();let k='c_'+cur;C[k]=C[k]||[];C[k].push({name:getAdminName(),text:t});localStorage.setItem('mn_comments',JSON.stringify(C));document.getElementById('cIn').value='';renderComments();}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('mn_dark',document.body.classList.contains('dark')?'1':'0');}
function setAdminPic(inp){let f=inp.files[0];if(!f)return;compress(f,d=>{localStorage.setItem('mn_admin_pic',d);render();});}
function saveName(){let n=document.getElementById('adminName').value.trim();if(!n)return;localStorage.setItem('mn_admin_name',n);render();alert('Saved');}
function share(){navigator.clipboard.writeText(location.href);alert('Link copied');}
(function(){if(localStorage.getItem('mn_dark')==='1')document.body.classList.add('dark');render();})();
</script></body></html>
